name: Build Gestion PVC APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip GestionPVC-Android-GitHub.zip -d source

      - name: Build APK
        run: gradle -p source/GestionPVC-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GestionPVC-APK
          path: source/GestionPVC-Android/app/build/outputs/apk/debug/app-debug.apk
